# Tokyo Night (night) — same palette as tmux and the plan-board status row.
# Theme file from folke/tokyonight.nvim extras/alacritty; swap the filename for _storm/_moon/_day.
[general]
import = ["~/.config/alacritty/themes/tokyonight_night.toml"]

[cursor.style]
blinking = "On"
shape = "Block"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 14.0

# [font.normal]
# family = "JetBrainsMono"
# style = "Regular"

[window]
opacity = 0.9

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 8
y = 8
