# GitHub Dark (default) — same Primer palette as tmux, nvim and the plan-board status row.
# Theme file from alacritty/alacritty-theme. tokyonight_night.toml is kept in themes/ to swap back.
[general]
import = ["~/.config/alacritty/themes/github_dark_default.toml"]

# The theme file ships the old GitHub terminal foreground (#b3b1ad); Primer's fg.default is what
# nvim and the status row use, so override it here (the main file wins over imports).
[colors.primary]
foreground = "#e6edf3"

[cursor.style]
blinking = "On"
shape = "Block"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 14.0

# [font.normal]
# family = "JetBrainsMono"
# style = "Regular"

[window]
opacity = 0.9

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 8
y = 8
