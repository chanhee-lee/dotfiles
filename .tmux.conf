# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save and resume sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # Works with above to auto-save
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @continuum-restore 'on' # auto restore session
# Restore claude panes via claude-revive (exact per-pane session resume, map kept
# by the claude-pane-map SessionStart hook in chanos). On machines without chanos
# the missing script falls through to the plain resume picker.
set -g @resurrect-processes '"~claude->~/chanos/scripts/claude-revive || claude --resume" "~tmux new -A -s laptop"'
# Only the `mini` connection (ssh … /opt/homebrew/bin/tmux new -A -s laptop) is replayed, so a
# restore reattaches to the Mac mini's tmux. Other ssh commands are deliberately not replayed.
# plan-board popup for the current pane (board kept by ~/chanos/skills/plan-board; path
# hardcoded the same way as claude-revive — see chanos connections.md)
bind P run-shell "~/chanos/scripts/plan-board-popup '#{pane_id}'"

setw -g mode-keys vi

# Style setting : GitHub Dark (default) — accent #58a6ff, border #30363d, bar #161b22, muted #8b949e.
# Same values as ~/.config/alacritty, nvim (github_dark_default) and ~/chanos/scripts/plan_board.py.
set -g mode-style "fg=#58a6ff,bg=#30363d"

set -g message-style "fg=#58a6ff,bg=#30363d"
set -g message-command-style "fg=#58a6ff,bg=#30363d"

set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#58a6ff,bg=#161b22"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#0d1117,bg=#58a6ff,bold] #S #[fg=#58a6ff,bg=#161b22,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#161b22,bg=#161b22,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#161b22] #{prefix_highlight} #[fg=#30363d,bg=#161b22,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#30363d] %Y-%m-%d  %I:%M %p #[fg=#58a6ff,bg=#30363d,nobold,nounderscore,noitalics]#[fg=#0d1117,bg=#58a6ff,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#161b22,bg=#161b22,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#161b22] #{prefix_highlight} #[fg=#30363d,bg=#161b22,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#30363d] %Y-%m-%d  %H:%M #[fg=#58a6ff,bg=#30363d,nobold,nounderscore,noitalics]#[fg=#0d1117,bg=#58a6ff,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#8b949e,bg=#161b22"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#8b949e,bg=#161b22"
setw -g window-status-format "#[fg=#161b22,bg=#161b22,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#161b22,bg=#161b22,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#161b22,bg=#30363d,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#30363d,bold] #I  #W #F #[fg=#30363d,bg=#161b22,nobold,nounderscore,noitalics]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
